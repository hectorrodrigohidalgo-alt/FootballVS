name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

# El pipeline sólo necesita leer el código del repositorio.
permissions:
  contents: read

# Si llega un commit nuevo a la misma rama, cancela la ejecución anterior para
# no consumir minutos gratuitos en una validación que ya quedó obsoleta.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci respeta exactamente el lockfile y falla si está desactualizado.
      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

  api:
    name: API quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install API dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint API
        run: python -m ruff check .

      - name: Test API
        run: python -m pytest
