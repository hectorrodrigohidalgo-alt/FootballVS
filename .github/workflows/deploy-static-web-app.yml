name: Deploy Azure Static Web Apps

on:
  push:
    branches:
      - feat/Fase-5-Calidad-Despliegue
      - main
  workflow_dispatch:

# El despliegue sólo necesita leer el repositorio. El acceso a Azure se limita
# al token de la Static Web App guardado como secreto de GitHub.
permissions:
  contents: read

concurrency:
  group: deploy-static-web-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Free Static Web App
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      # Azure construye la API Python 3.11 a partir de api/requirements.txt.
      # El frontend ya está compilado para evitar depender del Node de Oryx.
      - name: Deploy frontend and managed API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          api_location: api
          output_location: ''
          skip_app_build: true
          production_branch: feat/Fase-5-Calidad-Despliegue
